name: Build installers

# PyInstaller can't cross-compile, so each installer is built on its own OS.
# Every push to main publishes a "build-N" release; pushing a v* tag publishes a versioned one.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

# One run per commit; a newer push doesn't cancel an older one, so every commit gets its release.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # Apple Silicon
            target: --mac
          - os: macos-15-intel # Intel Macs
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bundle engine
        run: npm run build:engine
        env:
          LOCUS_PYTHON: python

      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: locus-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Release name
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=Locus $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "name=Locus $version (build $GITHUB_RUN_NUMBER)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: artifacts/*
          body: |
            Built from ${{ github.sha }}.

            ${{ github.event.head_commit.message }}

            **Downloads**
            - macOS Apple Silicon (M1–M5): `Locus-*-mac-arm64.dmg`
            - macOS Intel: `Locus-*-mac-x64.dmg`
            - Windows 10/11: `Locus-*-win-x64.exe`

            The apps aren't code-signed yet. On macOS, right-click the app and choose **Open** the first time
            (or run `xattr -dr com.apple.quarantine /Applications/Locus.app`). On Windows, choose
            **More info › Run anyway** in SmartScreen. Windows also needs **Apple Devices** (Microsoft Store) or iTunes.
